<div class="container card my-5">
    <h1 class="my-2">Student Info</h1>
    <table class="table">
        <thead>
            <tr>
                <td scope="col">Name</td>
                <td scope="col">Age</td>
                <td scope="col">Course</td>
            </tr>
        </thead>
        <tr *ngFor="let stud of studentList">
            <td>{{stud.name}}</td>
            <td>{{stud.age}}</td>
            <td>{{stud.course}}</td>
        </tr>
    </table>
</div>
